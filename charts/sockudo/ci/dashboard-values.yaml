# persistence is enabled alongside a mysql app manager on purpose. It reads oddly against
# values.yaml ("Needed when dashboard.databaseDriver=sqlite"), but sqlite refuses to render
# with dashboard.autoscaling.api enabled, and this is the only combination that exercises
# both dashboard-pvc.yaml and dashboard-hpa.yaml.
config:
  appManagerDriver: mysql
dashboard:
  enabled: true
  api:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
  web:
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
        maxSurge: 1
  sessionSecret:
    value: ci-render-only-not-a-real-secret
  persistence:
    enabled: true
    size: 1Gi
  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: sockudo-admin.ci.example.com
        paths:
          - path: /
            pathType: Prefix
  autoscaling:
    api:
      enabled: true
      # Set on api only, so web keeps covering the generated CPU/memory Resource path.
      metrics:
        - type: Pods
          pods:
            metric:
              name: dashboard_active_sessions
            target:
              type: AverageValue
              averageValue: "50"
    web:
      enabled: true
  pdb:
    api:
      enabled: true
    web:
      enabled: true
  networkPolicy:
    enabled: true
